# A "workspace" groups several crates (Rust packages) so they share one
# `Cargo.lock` and one `target/` folder, and `cargo test` runs them all.
[workspace]
resolver = "3"
members = ["crates/core", "crates/api", "crates/server", "crates/web", "crates/lint"]

# Fields every crate inherits with `x.workspace = true`, so we write them once.
[workspace.package]
version = "0.1.0"
edition = "2024"
