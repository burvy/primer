[package]
name = "primer-lint"
version.workspace = true
edition.workspace = true

[dependencies]
primer-core = { path = "../core" }
primer-server = { path = "../server" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt", "macros"] }
toml = "1.1.8"
