[package]
name = "primer-server"
version.workspace = true
edition.workspace = true

[dependencies]
primer-core = { path = "../core" }
primer-api = { path = "../api" }
async-trait = "0.1.92"
axum = "0.8.9"
rand = { version = "0.10.3", default-features = false, features = ["std_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
latex2mathml = "0.2.3"
toml = "1.1.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls"] }
secrecy = "0.10.3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
