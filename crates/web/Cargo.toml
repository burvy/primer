[package]
name = "primer-web"
version.workspace = true
edition.workspace = true

# A library as well as the app, so another site can call `mount` (see lib.rs).
[lib]
crate-type = ["rlib"]

[dependencies]
gloo-net = "0.7.0"
leptos = { version = "0.8.22", features = ["csr"] }
primer-core = { path = "../core" }
primer-api = { path = "../api" }
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
serde = { version = "1.0.229", features = ["derive"] }
web-sys = { version = "0.3.106", features = ["Element", "HtmlElement", "Window", "Storage"] }
