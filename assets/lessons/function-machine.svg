<!-- PLACEHOLDER function machine for chapter 1 (the +1 machine).
     The human redraws every shape in Inkscape; code NEVER draws these parts.
     Keep the named layers: code shows/animates them by id:
       #label-box     empty box: the code writes the beat's label (+1, +0, +2) centred in it
       #input-glow, #output-glow   stroke rings in `mark`: the code only shows or hides them
       #hatch-closed / #hatch-open the code swaps them when the block drops through
       #block         the number-block: it travels from the funnel to the chute
       #gear          turns around (290,200) while a block passes
       #pipe          joins two machines side by side
     Colours: ONLY the Parchment palette (docs/PALETTE.md). The page swaps those
     exact hex values for the current look. Canvas: 400 x 300. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#F4E9D0"/>
  <g inkscape:groupmode="layer" inkscape:label="body" id="body">
    <rect x="110" y="80" width="180" height="160" rx="12" fill="#B07A4A" stroke="#3B2A1E" stroke-width="4"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="funnel" id="funnel">
    <path d="M140 40 L260 40 L210 80 L190 80 Z" fill="#E6D5B0" stroke="#3B2A1E" stroke-width="4"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="chute" id="chute">
    <rect x="180" y="240" width="40" height="40" fill="#E6D5B0" stroke="#3B2A1E" stroke-width="4"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="front-panel" id="front-panel">
    <rect x="130" y="110" width="140" height="60" fill="#F4E9D0" stroke="#3B2A1E" stroke-width="4"/>
    <rect id="label-box" x="140" y="116" width="120" height="48" fill="none"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="input-glow" id="input-glow">
    <ellipse cx="200" cy="40" rx="62" ry="14" fill="none" stroke="#A63D2F" stroke-width="4"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="output-glow" id="output-glow">
    <ellipse cx="200" cy="270" rx="36" ry="22" fill="none" stroke="#A63D2F" stroke-width="4"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="hatch-closed" id="hatch-closed">
    <rect x="150" y="180" width="100" height="12" fill="#3B2A1E"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="hatch-open" id="hatch-open" opacity="0.25">
    <rect x="150" y="180" width="38" height="12" fill="#3B2A1E"/>
    <rect x="212" y="180" width="38" height="12" fill="#3B2A1E"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="block" id="block">
    <rect x="185" y="52" width="30" height="30" fill="#D9A441" stroke="#3B2A1E" stroke-width="4"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="gear" id="gear">
    <circle cx="290" cy="200" r="22" fill="none" stroke="#3B2A1E" stroke-width="4"/>
    <circle cx="290" cy="200" r="7" fill="#3B2A1E"/>
    <path d="M290 178 V222 M268 200 H312" stroke="#3B2A1E" stroke-width="4"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="pipe" id="pipe">
    <path d="M312 200 H360 V120" fill="none" stroke="#3B2A1E" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
